spring.application.name=Stall-Reservation

# HTTPS / SSL Configuration
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=bookfair
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}

# CORS Allowed Origins
app.security.cors.allowed-origins=https://localhost:5173,http://localhost:5173

spring.datasource.url=jdbc:mysql://localhost:3306/bookfair?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# OIDC Identity Provider Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER:}

app.security.oauth2.audience=${OIDC_AUDIENCE:https://bookfair-api}

# Mail (configure for your SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

#
#spring.mail.properties.mail.smtp.ssl.enable=false
#spring.mail.properties.mail.debug=false

#spring.mail.properties.mail.smtp.auth=true
#spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.properties.mail.debug=false
spring.mail.properties.mail.transport.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.socketFactory.port=465
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory

#
#spring.mail.properties.mail.smtp.auth=true
#spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000


# File upload
app.upload.dir=uploads
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=60MB

# Business rules
app.booking.max-stalls-per-booking=3
app.booking.advance-percent=10
app.booking.days-before-event-no-booking=3
app.cancellation.allowed-days-before=7

# Enable Security Debug Logging
logging.level.org.springframework.security=DEBUG